name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Copy web app into Android assets
        run: |
          A=android/app/src/main/assets
          rm -rf "$A" && mkdir -p "$A"
          cp index.html "$A/"
          cp -r fonts lib "$A/"
          cp icon.png icon-192.png icon-512.png "$A/"

      - name: Build signed APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Shelem.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Shelem-apk
          path: Shelem.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: شلم نسخهٔ 1.0.${{ github.run_number }}
          body: |
            امتیازشمار شلم — فایل نصبی اندروید.
            فایل Shelem.apk را دانلود و روی گوشی نصب کنید.
          files: Shelem.apk
          make_latest: true
